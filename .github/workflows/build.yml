name: Build plugin
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x   # use 10.0.x if you applied Step 0
      - run: dotnet publish Jellyfin.Plugin.Newsletters -c Release -o out
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: out
